name: Code Formatter (CSharpier)

on:
  # push:
  #   branches: [develop]
  # pull_request:
  #   types: [labeled]
  workflow_dispatch:

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    # LOGIC CONDITION:
    # - If it's a push: runs only if NOT associated with a PR (to avoid duplicates with the labeled event)
    # - If it's a PR: runs only if the label is '_trigger-format'
    # - If it's manual (workflow_dispatch): always runs
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.repository.default_branch != github.ref && format('refs/heads/{0}', github.head_ref) != github.ref) ||
      (github.event_name == 'pull_request' && github.event.label.name == '_trigger-format')

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install CSharpier
        run: |
          dotnet new tool-manifest
          dotnet tool install csharpier --version 1.2.6

      - name: Run CSharpier Format
        run: dotnet tool run csharpier format ./Assets --config-path ./.editorconfig

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format C# code with CSharpier"
          file_pattern: 'Assets/**/*.cs'
